server:
  port: 8848
  tomcat:
    basedir: logs

spring:
  application:
    name: nacos
  main:
    allow-circular-references: true
  security:
    enabled: false

# 👇👇👇 只保留这个 db 配置！！！这是 Nacos 2.x 唯一认的数据源配置
db:
  num: 1
  user: root
  password: 20040104
  url: jdbc:mysql://127.0.0.1:3306/nacos_config?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true

nacos:
  core:
    auth:
      enabled: false
      system.type: nacos
      plugin.nacos.token.secret.key: SecretKey012345678901234567890123456789012345678901234567890123456789
  security:
    ignore:
      urls: /,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-fe/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**

management:
  endpoints:
    web:
      exposure:
        include: '*'